# Cliper Agent — production stack for one Linux server (VM, VPS or bare metal).
# Usage (from the repo root):  bash deploy/deploy.sh
#   (= docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build)
name: cliper-agent

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cliper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-cliper_agent}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      # Use your own database server instead: set DATABASE_URL in deploy/.env (the db service can then be removed)
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-cliper}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cliper_agent}?schema=public}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # 1 behind Caddy; 2 when a Cloudflare Tunnel sits in front of Caddy
      TRUST_PROXY: ${TRUST_PROXY:-1}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      STORAGE_DIR: /app/storage
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
      MAX_SOURCE_MINUTES: ${MAX_SOURCE_MINUTES:-180}
      MAX_CLIPS_PER_JOB: ${MAX_CLIPS_PER_JOB:-50}
      CLIP_CONCURRENCY: ${CLIP_CONCURRENCY:-1}
      KEEP_JOBS_DAYS: ${KEEP_JOBS_DAYS:-7}
      X264_PRESET: ${X264_PRESET:-veryfast}
      X264_CRF: ${X264_CRF:-22}
      VIDEO_ENCODER: ${VIDEO_ENCODER:-libx264}
      RENDER_PARALLEL: ${RENDER_PARALLEL:-0}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      PUBLISH_CONCURRENCY: ${PUBLISH_CONCURRENCY:-2}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      X_CLIENT_ID: ${X_CLIENT_ID:-}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      TRENDING_REGION: ${TRENDING_REGION:-US}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-600}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-30}
    volumes:
      - storage:/app/storage
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on: [api]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-cliper}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-cliper_agent}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-1}
    env_file:
      - path: ./backup.env
        required: false
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["sh", "/backup.sh", "loop"]
    networks: [internal]

  # Optional: reach the server from the internet without opening ports (set TUNNEL_TOKEN in deploy/.env;
  # deploy.sh then starts this). The tunnel's public hostname must point at http://web:80.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    depends_on: [web]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    networks: [internal]

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:

networks:
  internal:
