# NVIDIA card (NVENC): added by deploy.sh when GPU=nvidia.
# The card must be passed through to this VM, with the NVIDIA driver and nvidia-container-toolkit
# installed in it (docs/PROXMOX.md).
services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile.gpu
    environment:
      VIDEO_ENCODER: ${VIDEO_ENCODER:-h264_nvenc}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video]
