# Local development: the database (and optionally the API in a container with ffmpeg + yt-dlp built in).
#   docker compose up -d db          → just Postgres, run the API with `npm run dev`
#   docker compose up -d --build     → Postgres + API on http://localhost:4000
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cliper
      POSTGRES_PASSWORD: cliper
      POSTGRES_DB: cliper_agent
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://cliper:cliper@db:5432/cliper_agent?schema=public
      STORAGE_DIR: /app/storage
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
      YTDLP_PATH: yt-dlp
    ports:
      - "4000:4000"
    volumes:
      - storage:/app/storage

volumes:
  pgdata:
  storage:
